name: meetscheduler

services:
  postgres:
    image: postgres:16
    container_name: postgres-container
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - meetscheduler_volume:/var/lib/postgresql/data

volumes:
  meetscheduler_volume: