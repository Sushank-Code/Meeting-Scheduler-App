<!doctype html>
<html lang="en">

<body style="margin:0;background:#f6f7fb;font-family:Arial,sans-serif;color:#1f2937;">
  <div style="max-width:600px;margin:32px auto;background:#ffffff;padding:32px;border-radius:12px;">
    <h1 style="margin-top:0;color:#111827;">Meeting created</h1>
    <p>Your meeting <strong>{{ title }}</strong> was created successfully.</p>
    <p><strong>When:</strong> {{ start }}</p>
    <p><a href="{{ meeting_link }}"
        style="display:inline-block;background:#2563eb;color:#ffffff;padding:12px 18px;border-radius:6px;text-decoration:none;">Open
        meeting link</a></p>
  </div>
</body>

</html>
