<!doctype html>
<html lang="en">

<body style="margin:0;background:#f6f7fb;font-family:Arial,sans-serif;color:#1f2937;">
  <div style="max-width:600px;margin:32px auto;background:#ffffff;padding:32px;border-radius:12px;">
    <h1 style="margin-top:0;color:#111827;">You're invited</h1>
    <p><strong>{{ organizer_name }}</strong> invited you to <strong>{{ title }}</strong>.</p>
    <p><strong>When:</strong> {{ start }}</p>
    <p><a href="{{ meeting_link }}"
        style="display:inline-block;background:#2563eb;color:#ffffff;padding:12px 18px;border-radius:6px;text-decoration:none;">Join
        meeting</a></p>
    <p>Please let the organizer know whether you can attend:</p>
    <p>
      <a href="{{ accept_url }}"
        style="display:inline-block;background:#16a34a;color:#ffffff;padding:10px 16px;border-radius:6px;text-decoration:none;">Accept</a>
      <a href="{{ decline_url }}"
        style="display:inline-block;background:#dc2626;color:#ffffff;padding:10px 16px;border-radius:6px;text-decoration:none;margin-left:8px;">Decline</a>
    </p>
  </div>
</body>

</html>
